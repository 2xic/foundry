name: build-and-release

on:
  push:
    tags:
      - "v*.*.*"
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PROFILE: release

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `runner`: GHA runner label
          # `target`: Rust build target triple
          # `platform` and `arch`: Used in tarball names
          # `svm`: target platform to use for the Solc binary
          - runner: Linux-22.04
            target: x86_64-unknown-linux-gnu
            svm_target_platform: linux-amd64
            platform: linux
            arch: amd64
          - runner: Linux-22.04
            target: x86_64-unknown-linux-musl
            svm_target_platform: linux-amd64
            platform: alpine
            arch: amd64
          - runner: Linux-22.04
            target: aarch64-unknown-linux-gnu
            svm_target_platform: linux-aarch64
            platform: linux
            arch: arm64
          - runner: Linux-22.04
            target: aarch64-unknown-linux-musl
            svm_target_platform: linux-aarch64
            platform: alpine
            arch: arm64
          # This is pinned to `macos-13-large` to support old SDK versions.
          # If the runner is deprecated it should be pinned to the oldest available version of the runner.
          - runner: macos-13-large
            target: x86_64-apple-darwin
            svm_target_platform: macosx-amd64
            platform: darwin
            arch: amd64
          - runner: macos-latest-large
            target: aarch64-apple-darwin
            svm_target_platform: macosx-aarch64
            platform: darwin
            arch: arm64
          - runner: Windows
            target: x86_64-pc-windows-msvc
            svm_target_platform: windows-amd64
            platform: win32
            arch: amd64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Apple M1 setup
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          echo "SDKROOT=$(xcrun -sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=$(xcrun -sdk macosx --show-sdk-platform-version)" >> $GITHUB_ENV

      - name: Install cross for musl/aarch64 targets
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build forge
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: target/${{ matrix.target }}/${{ env.PROFILE }}
        shell: bash
        run: |
          set -eo pipefail
          flags=(--target $TARGET --profile $PROFILE --bin forge
            --no-default-features --features aws-kms,gcp-kms,cli,asm-keccak)

          # `jemalloc` is not fully supported on MSVC or aarch64 Linux.
          if [[ "$TARGET" != *msvc* && "$TARGET" != "aarch64-unknown-linux-gnu" ]]; then
            flags+=(--features jemalloc)
          fi

          [[ "$TARGET" == *windows* ]] && ext=".exe"

          if [[ "$TARGET" == *-musl || "$TARGET" == "aarch64-unknown-linux-gnu" ]]; then
            cross build "${flags[@]}"
          else
            cargo build "${flags[@]}"
          fi

          # Verify and get info about forge binary
          forge_bin=$OUT_DIR/forge$ext
          if [[ -f "$forge_bin" ]]; then
            echo "✓ Built forge"
            file "$forge_bin" || true
            du -h "$forge_bin" || true
            $forge_bin --version || true
          else
            echo "✗ Failed to build forge"
            exit 1
          fi

      - name: Package forge binary
        id: package
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          OUT_DIR: target/${{ matrix.target }}/${{ env.PROFILE }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        shell: bash
        run: |
          [[ "$TARGET" == *windows* ]] && ext=".exe"

          if [[ "$PLATFORM" == "linux" || "$PLATFORM" == "alpine" ]]; then
            tar -czvf "forge_${VERSION_NAME}_${PLATFORM}_${ARCH}.tar.gz" -C $OUT_DIR forge
            echo "file_name=forge_${VERSION_NAME}_${PLATFORM}_${ARCH}.tar.gz" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" == "darwin" ]; then
            # We need to use gtar here otherwise the archive is corrupt.
            # See: https://github.com/actions/virtual-environments/issues/2619
            gtar -czvf "forge_${VERSION_NAME}_${PLATFORM}_${ARCH}.tar.gz" -C $OUT_DIR forge
            echo "file_name=forge_${VERSION_NAME}_${PLATFORM}_${ARCH}.tar.gz" >> $GITHUB_OUTPUT
          else
            cd $OUT_DIR
            7z a -tzip "forge_${VERSION_NAME}_${PLATFORM}_${ARCH}.zip" forge.exe
            mv "forge_${VERSION_NAME}_${PLATFORM}_${ARCH}.zip" ../../../
            echo "file_name=forge_${VERSION_NAME}_${PLATFORM}_${ARCH}.zip" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifacts (for non-release builds)
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.file_name }}
          path: ${{ steps.package.outputs.file_name }}
          retention-days: 7

      - name: Upload to release (for tagged builds)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.file_name }}
          draft: false
          prerelease: false
